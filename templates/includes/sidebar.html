<h4 class="mb-4">Task Manager</h4>

{% if user.is_authenticated %}
  <p class="small text-muted mb-3">
    User:
    <a href="{% url 'tasks:worker-detail' pk=user.pk %}" class="text-white font-weight-bold">
      {{ user.username }}
    </a>
  </p>
  <form method="post" action="{% url 'logout' %}" class="mb-4">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-light btn-sm btn-block">Logout</button>
  </form>
{% else %}
  <a href="{% url 'login' %}" class="btn btn-primary btn-sm btn-block mb-4">Login</a>
{% endif %}

<ul class="nav flex-column nav-pills">
  <li class="nav-item mb-1">
    <a class="nav-link text-white" href="{% url 'tasks:index' %}">Dashboard</a>
  </li>
  <li class="nav-item mb-1">
    <a class="nav-link text-white" href="{% url 'tasks:task-list' %}">Tasks</a>
  </li>
  <li class="nav-item mb-1">
    <a class="nav-link text-white" href="{% url 'tasks:worker-list' %}">Workers</a>
  </li>
  <li class="nav-item mb-1">
    <a class="nav-link text-white" href="{% url 'tasks:position-list' %}">Positions</a>
  </li>
  <li class="nav-item mb-1">
    <a class="nav-link text-white" href="{% url 'tasks:task-type-list' %}">Task Types</a>
  </li>
</ul>
